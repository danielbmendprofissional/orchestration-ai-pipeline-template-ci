# ============================================================
# =                  TEMPLATE SEGURANÇA - TRIVY
# ============================================================
# Dois papéis:
#   .trivy-fs     SCA das dependências do código (NuGet / npm). Usa os artifacts do
#                 build (*.deps.json, lock files) pra enxergar a árvore resolvida.
#                 Só vulnerabilidade — secret fica com o BetterLeaks e IaC com o Checkov.
#   .trivy-image  CVEs da imagem gerada (SO base + runtime + app), por digest.
#                 Roda em toda pipeline, inclusive promotion: CVE novo pode ter sido
#                 publicado depois do build.
#
# A decisão de bloquear NÃO é daqui — os jobs sempre passam e o security-gate decide.
.trivy-base:
  stage: security
  image:
    name: aquasec/trivy:0.76.0
    entrypoint: [""]
  tags:
    - $RUNNER_TAG
  timeout: 20 minutes
  interruptible: true
  variables:
    TRIVY_CACHE_DIR: .trivycache/
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/

.trivy-fs:
  extends: .trivy-base
  script:
    - |
      set -eu
      trivy fs --scanners vuln --format json --output trivy-fs.json \
        --skip-dirs .nuget --skip-dirs .npm --skip-dirs .trivycache \
        --exit-code 0 .
      echo "[INFO] trivy-fs.json gerado"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-fs.json

.trivy-image:
  extends: .trivy-base
  variables:
    GIT_STRATEGY: none
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_JOB_TOKEN
  script:
    - |
      set -eu
      if [ -z "${IMAGE_REFS:-}" ]; then
        echo "[ERRO] IMAGE_REFS ausente — o dotenv do job de imagem não chegou"
        exit 1
      fi

      for pair in $(echo "$IMAGE_REFS" | tr ',' ' '); do
        name="${pair%%=*}"
        ref="${pair#*=}"
        echo "======================================"
        echo "= TRIVY IMAGE: $name"
        echo "======================================"
        trivy image --scanners vuln --format json --output "trivy-image-$name.json" --exit-code 0 "$ref"
      done
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-image-*.json
