# Um overlay por ambiente: dev, qa, hml, production (nome = PIPELINE_ENV).
# Copie esta pasta e ajuste namespace/host/réplicas.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meu-projeto
resources:
  - ../../base
  - ingress.yaml
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ASPNETCORE_ENVIRONMENT
          value: Qa
