# ============================================================
# =                  TEMPLATE TEST - .NET
# ============================================================
# DOTNET_TESTS: caminhos de .csproj de teste, separados por espaço.
# Relatório JUnit no GitLab quando o projeto referencia JunitXml.TestLogger.
.test-dotnet:
  stage: test
  image: ${DOTNET_SDK_IMAGE}
  tags:
    - $RUNNER_TAG
  timeout: 30 minutes
  interruptible: true
  variables:
    DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    key: nuget-packages
    paths:
      - .nuget/packages/
    policy: pull
  script:
    - |
      set -eu
      mkdir -p test-results
      FAILED=""

      for csproj in $DOTNET_TESTS; do
        echo "======================================"
        echo "= TESTANDO: $csproj"
        echo "======================================"

        if [ ! -f "$csproj" ]; then
          echo "[ERRO] Projeto de teste não encontrado: $csproj"
          exit 1
        fi

        set -- "$csproj" -c Release
        if grep -q "JunitXml.TestLogger" "$csproj"; then
          report="$CI_PROJECT_DIR/test-results/$(basename "$csproj" .csproj).xml"
          set -- "$@" --logger "junit;LogFilePath=$report"
        fi

        dotnet test "$@" || FAILED="$FAILED $csproj"
      done

      if [ -n "$FAILED" ]; then
        echo "[ERRO] Testes falharam em:$FAILED"
        exit 1
      fi
      echo "[INFO] Todos os projetos de teste passaram"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - test-results/*.xml
